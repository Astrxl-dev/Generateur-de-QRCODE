<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR Code</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root { --bg: #0d0d0d; --surface: #161616; --border: #2a2a2a; --accent: #6ee7b7; --text: #e8e8e8; --muted: #5a5a5a; padding-top: env(safe-area-inset-top,0px); padding-bottom: env(safe-area-inset-bottom,0px); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; background: var(--bg); color: var(--text); font-family: 'SF Mono', monospace; display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem; }
  h1 { font-size: 1rem; color: var(--accent); letter-spacing: 0.08em; margin-bottom: 0.2rem; }
  .sub { font-size: 0.7rem; color: var(--muted); margin-bottom: 2rem; }
  .card { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
  label { font-size: 0.68rem; color: var(--muted); display: block; margin-bottom: 0.3rem; letter-spacing: 0.06em; }
  input, select { width: 100%; background: #0d0d0d; border: 1px solid var(--border); border-radius: 7px; color: var(--text); font-family: inherit; font-size: 0.88rem; padding: 0.6rem 0.8rem; outline: none; transition: border-color 0.15s; }
  input:focus, select:focus { border-color: var(--accent); }
  .row { display: flex; gap: 0.8rem; }
  .row > div { flex: 1; }
  button { width: 100%; background: var(--accent); color: #0d0d0d; border: none; border-radius: 7px; font-family: inherit; font-size: 0.88rem; font-weight: 700; padding: 0.7rem; cursor: pointer; transition: opacity 0.15s; }
  button:hover { opacity: 0.85; }
  .output { display: none; flex-direction: column; align-items: center; gap: 1rem; margin-top: 1.5rem; }
  .output.on { display: flex; }
  #qr-wrap { background: #fff; border-radius: 10px; padding: 1rem; }
  .dl { background: transparent; border: 1px solid var(--accent); color: var(--accent); width: auto; padding: 0.45rem 1.2rem; font-size: 0.78rem; border-radius: 6px; }
</style>
</head>
<body>
<h1>QR CODE</h1>
<p class="sub">génère un QR code permanent</p>
<div class="card">
  <div>
    <label>Url</label>
    <input type="text" id="content" placeholder="https://...">
  </div>
  <div class="row">
    <div>
      <label>Taille (px)</label>
      <input type="number" id="size" value="256" min="100" max="600">
    </div>
    <div>
      <label>Correction</label>
      <select id="level">
        <option value="L">L — léger</option>
        <option value="M" selected>M — moyen</option>
        <option value="H">H — max</option>
      </select>
    </div>
  </div>
  <button onclick="gen()">Générer</button>
</div>
<div class="output" id="out">
  <div id="qr-wrap"><div id="qrcode"></div></div>
  <button class="dl" onclick="dl()">Télécharger au format PNG</button>
</div>
<script>
function gen() {
  const c = document.getElementById('content').value.trim();
  if (!c) return;
  const size = parseInt(document.getElementById('size').value) || 256;
  const lvl = { L: QRCode.CorrectLevel.L, M: QRCode.CorrectLevel.M, H: QRCode.CorrectLevel.H }[document.getElementById('level').value];
  document.getElementById('qrcode').innerHTML = '';
  new QRCode(document.getElementById('qrcode'), { text: c, width: size, height: size, colorDark: '#000', colorLight: '#fff', correctLevel: lvl });
  document.getElementById('out').classList.add('on');
}
function dl() {
  const canvas = document.querySelector('#qrcode canvas');
  if (!canvas) return;
  const a = document.createElement('a');
  a.download = 'qrcode.png';
  a.href = canvas.toDataURL();
  a.click();
}
document.getElementById('content').addEventListener('keydown', e => { if (e.key === 'Enter') gen(); });
</script>
</body>
</html>
